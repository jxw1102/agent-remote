<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<!-- Installed to a home screen: the page runs under a translucent status bar. -->
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Agent Remote</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='54' fill='%2312121a'/%3E%3Cpath d='M34 40 L48 54 L34 68' stroke='%23d97757' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M56 68 L76 68' stroke='%2300d4ff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="app">
  <!-- Portrait phone: the open conversations as bubbles above the session
       sheet, like a browser's tabs. Hidden everywhere else. -->
  <nav id="tabstrip" class="tabstrip" aria-label="Open conversations"></nav>
  <!-- Left: every daemon's sessions in one list. -->
  <aside class="pane-list">
    <header class="list-head">
      <div class="head-row">
      <div class="brand">
        <svg class="logo" viewBox="0 0 108 108" aria-hidden="true">
          <path d="M34 40 L48 54 L34 68" stroke="#d97757" stroke-width="7"
                fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M56 68 L76 68" stroke="#00d4ff" stroke-width="7"
                stroke-linecap="round"/>
        </svg>
      </div>
      <!-- Row 1: which sessions (Focus | All, renderFilters), then the places
           you visit now and then. The mark shows when there is room. -->
        <div id="filters" class="filters"></div>
        <div id="list-status" class="list-status" role="status"></div>
        <div class="head-tools">
          <button id="btn-inbox" class="icon-btn" type="button"
                  title="Inbox — files from the host" aria-label="Inbox">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round">
              <path d="M4 13l2.5-7h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>
              <path d="M4 13h4.5a3.5 3.5 0 0 0 7 0H20"/>
            </svg>
          </button>
          <button id="btn-usage" class="icon-btn" type="button"
                  title="Subscription usage" aria-label="Usage">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round">
              <path d="M5 20V11M12 20V4M19 20v-6"/>
            </svg>
          </button>
          <button id="btn-profiles" class="icon-btn" type="button"
                  title="Daemons" aria-label="Daemons">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="7" rx="1.5"/>
              <rect x="4" y="13" width="16" height="7" rx="1.5"/>
              <path d="M8 7.5h.01M8 16.5h.01"/>
            </svg>
          </button>
          <button id="btn-sound" class="icon-btn" type="button" title="Sound cues"
                  aria-label="Sound cues" aria-pressed="true">♪</button>
        </div>
      </div>
      <!-- Row 2: find one, on which daemon, or start one. -->
      <div class="head-row head-row-find">
        <input id="search" class="search" type="search"
               placeholder="Search…" aria-label="Search titles and messages"
               autocomplete="off" spellcheck="false">
        <div id="filter-daemon" class="filter-daemon"></div>
        <button id="btn-new" class="primary" type="button" title="New session"
                aria-label="New session"><span class="new-long">New session</span><span
                class="new-short">New</span></button>
      </div>
    </header>
    <div id="sessions" class="sessions" tabindex="0"></div>
    <!-- Is what the list shows live? One line, per daemon when it is not. -->
    <div id="conn" class="conn hidden" role="status" aria-live="polite"></div>
  </aside>

  <!-- Right: the open transcript. -->
  <main class="pane-chat">
    <!-- The session's bar and its live strip float over the top of the
         conversation, which scrolls on underneath them. -->
    <!-- Shown for a moment when the bar folds: which session this is. -->
    <div id="chat-float" class="chat-float">
    <header id="chat-head" class="chat-head hidden">
      <!-- Narrow windows show one pane at a time; this returns to the list. -->
      <button id="btn-back" class="icon-btn back-btn" type="button"
              title="Back to sessions" aria-label="Back to sessions">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="chat-title">
        <h1 id="chat-title">Session</h1>
        <div id="chat-sub" class="chat-sub"></div>
      </div>
      <div class="chat-actions">
        <!-- Icon buttons (titles keep labels for hover + a11y).
             Options stays in the row at every width: how the next turn
             runs is what you reach for most. The group after it is what you
             do now and then (changes, rename, share, reload, copy id); in a
             narrow window it folds into a menu under "More" so the header
             stays one row. -->
        <div id="chat-more" class="chat-more">
        <!-- How the next turn runs: first in the More menu. -->
        <button id="btn-options" class="icon-btn" type="button"
                title="Options — model, effort, execution mode" aria-label="Session options">
          <!-- Cog / gear (not a sun — no radial rays). -->
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                     a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                     A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83
                     l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                     A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83
                     l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                     a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83
                     l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                     a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button id="btn-changes" class="icon-btn hidden" type="button"
                title="Changes — what differs from the last commit" aria-label="Changes"
                aria-pressed="false">
          <!-- Two documents, one with a plus/minus: a diff. -->
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>
            <path d="M9 12h6M12 9v6M9 18h6"/>
          </svg>
        </button>
        <button id="btn-rename" class="icon-btn" type="button"
                title="Rename session" aria-label="Rename session">
          <!-- Pencil. -->
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
          </svg>
        </button>
        <button id="btn-share" class="icon-btn hidden" type="button"
                title="Share a read-only link" aria-label="Share session">
          <!-- Share / link-out. -->
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
          </svg>
        </button>
        <button id="btn-reset" class="icon-btn hidden" type="button"
                title="Force stop this session on its host, so it can be opened again"
                aria-label="Reset on host">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v9"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/>
          </svg>
        </button>
        <button id="btn-refresh" class="icon-btn" type="button"
                title="Reload transcript" aria-label="Refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.3-5.6" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
            <path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="btn-copy-id" class="icon-btn menu-only" type="button"
                title="Copy session id" aria-label="Copy session id">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2"/>
            <path d="M5 15V6a2 2 0 0 1 2-2h9"/>
          </svg>
        </button>
        </div>
        <!-- Order: Chat|TUI · More (Session options first inside). Stop is in the bottom bar.
             Stop always keeps its slot (icon-idle = invisible, not removed)
             so nothing slides into that space when a job is not running. -->
        <!-- The session window's two faces: the chat, or the host terminal.
             Each session reopens on the face it was left on. -->
        <div id="btn-live-tui" class="face-switch icon-idle" role="tablist"
             aria-label="Session view" aria-hidden="true">
          <button type="button" role="tab" data-face="chat" aria-selected="true"
                  title="Chat" aria-label="Chat" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round">
              <path d="M4 5h16v11H9l-5 4z"/>
            </svg>
          </button>
          <button type="button" role="tab" data-face="tui" aria-selected="false"
                  title="TUI — the host terminal for this session" aria-label="TUI"
                  tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2"/>
              <path d="M7 9l3 3-3 3M12 15h5"/>
            </svg>
          </button>
        </div>
        <button id="btn-more" class="icon-btn more-btn" type="button"
                title="More" aria-label="More actions" aria-haspopup="true"
                aria-expanded="false" aria-controls="chat-more">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/>
            <circle cx="19" cy="12" r="1.8"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="banner" class="banner hidden"></div>
    </div>

    <!-- Shown when new output arrives while reading earlier messages. -->
    <button id="jump-latest" class="jump-latest hidden" type="button"
            aria-live="polite">Jump to latest</button>
    <div id="transcript" class="transcript">
      <!-- Filled by app.js showWelcomeIfNeeded() — one guide only (not also in the list). -->
      <div id="welcome" class="empty welcome" aria-busy="true"></div>
    </div>

    <!-- Live TUI: host tmux pane + keyboard capture (hidden by default). -->
    <div id="live-tui" class="live-tui hidden" tabindex="0">
      <div class="live-tui-bar">
        <!-- Meta row (status may change length) — never shares a line with keys. -->
        <div class="live-tui-meta">
          <span id="live-tui-status" class="live-tui-status">Host TUI</span>
          <!-- Capture chip: the one place that says where the keyboard goes.
               Pressed = the pane owns every keystroke; released = the text
               field below does, so a system IME can compose there. -->
          <button id="btn-tui-capture" type="button" class="tui-capture"
                  aria-pressed="false"
                  title="Send every keystroke to the host terminal">
            Keys: text field
          </button>
          <span id="live-tui-hint" class="live-tui-hint">
            Click the pane to send keys
          </span>
        </div>
        <!-- Soft keys: fixed-size buttons on their own row so layout never
             shifts. This row is deliberately the original eight — everything
             else reaches the host by being typed at the focused pane. -->
        <div id="live-tui-keys" class="live-tui-keys" role="toolbar" aria-label="Live TUI keys">
          <button type="button" data-tui-key="Escape" title="Escape">Esc</button>
          <button type="button" data-tui-key="Enter" title="Enter">Enter</button>
          <button type="button" data-tui-key="Tab" title="Tab">Tab</button>
          <button type="button" data-tui-key="Up" title="Up">↑</button>
          <button type="button" data-tui-key="Down" title="Down">↓</button>
          <button type="button" data-tui-key="Left" title="Left">←</button>
          <button type="button" data-tui-key="Right" title="Right">→</button>
          <!-- Clears what is typed in the terminal's own input box: Ctrl+U
               takes one line (or one line break) at a time, so it is sent
               enough times for a long draft. Nothing happens on an empty box. -->
          <button type="button" data-tui-key="Ctrl+U" data-tui-repeat="24"
                  title="Clear the terminal's input (Ctrl+U)" aria-label="Clear input">Clr</button>
          <button type="button" data-tui-key="Ctrl+C" title="Ctrl+C">^C</button>
        </div>
      </div>
      <!-- tabindex: a <pre> takes no focus of its own, so without this the
           pane could never receive a keystroke. The inner <code> is the
           screen — it keeps the host's column count and centres in a wide
           window instead of stretching across it. -->
      <pre id="live-tui-pane" class="live-tui-pane" tabindex="0"
           role="group" aria-label="Host terminal"><span id="live-tui-more" class="live-tui-more"></span><code id="live-tui-history"></code><code id="live-tui-screen"></code></pre>
      <div class="live-tui-line">
        <!-- Shows or hides the row of terminal keys (Esc, Enter, arrows…): at the
             start of the bar, where the chat has its +. -->
        <button id="btn-tui-keys" class="icon-btn tui-keys-toggle" type="button"
                  aria-pressed="true" aria-controls="live-tui-keys"
                  title="Terminal keys" aria-label="Terminal keys"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14h10"/></svg></button>
        <div class="tui-input-wrap">
          <input id="live-tui-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Type into the terminal">
        </div>
        <button id="btn-tui-stop" class="icon-btn danger icon-idle stop-btn" type="button"
                title="Stop" aria-label="Stop" aria-hidden="true" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6.5" y="6.5" width="11" height="11" rx="1.5"
                  fill="currentColor"/>
          </svg>
        </button>
        <button id="btn-live-tui-send" class="primary send-btn" type="button" title="Send the line" aria-label="Send the line"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>

    <!-- A permission or question the open session is waiting on. Docked here
         rather than raised as a dialog, so it never replaces a dialog you are
         in the middle of and is still there after you look away. -->
    <!-- The bottom bar floats: the gate and the message box are cards over
         the bottom of the conversation, which scrolls on underneath them. -->
    <div id="chat-bottom" class="chat-bottom">
    <section id="gate" class="gate hidden" aria-label="The agent is waiting on you"></section>

    <!-- Model and effort: floating above the start of the bottom bar, and
         only while the message box has the keyboard. -->
    <div id="composer-chips" class="composer-chips" role="group"
         aria-label="How the next message runs"></div>
    <div id="composer" class="composer hidden">
      <div id="composer-note" class="composer-note hidden"></div>
      <div id="composer-pop" class="composer-pop hidden"></div>
      <div class="composer-row">
        <button id="btn-attach" type="button" title="Attach a file">+</button>
        <input id="file-attach" type="file" multiple hidden>
        <textarea id="prompt" rows="1" spellcheck="false"
                  placeholder="Message, /command or !shell · Enter sends"
                  aria-controls="composer-pop"></textarea>
        <!-- Stop the running turn: in the bottom bar, beside Send. -->
        <button id="btn-stop" class="icon-btn danger icon-idle stop-btn" type="button"
                title="Stop" aria-label="Stop" aria-hidden="true" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6.5" y="6.5" width="11" height="11" rx="1.5"
                  fill="currentColor"/>
          </svg>
        </button>
        <button id="btn-send" class="primary send-btn" type="button" title="Send" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
    </div>
  </main>

  <!-- Beside the transcript on a wide window, over it on a narrow one. -->
  <aside id="side" class="pane-side hidden" aria-label="Changes">
    <header class="side-head">
      <button id="side-back" class="icon-btn back-btn" type="button"
              title="Back to the session" aria-label="Back to the session">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="side-title">
        <h2>Changes</h2>
        <div id="side-sub" class="side-sub"></div>
      </div>
      <button id="side-refresh" type="button">Refresh</button>
      <button id="side-close" class="ghost" type="button" aria-label="Close changes">✕</button>
    </header>
    <div id="side-body" class="side-body" tabindex="0"></div>
    <footer id="side-foot" class="side-foot hidden"></footer>
  </aside>
</div>

<!-- Modal host: profiles, new session, inbox, usage, options, questions. -->
<div id="modal" class="modal hidden">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title">…</h2>
      <button id="modal-close" class="ghost" type="button" aria-label="Close">✕</button>
    </header>
    <div id="modal-body" class="modal-body"></div>
    <footer id="modal-foot" class="modal-foot"></footer>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="app.js"></script>
</body>
</html>
