name: AgentRemote
options:
  bundleIdPrefix: com.agentremote
  deploymentTarget:
    iOS: "17.0"
packages:
  AgentRemoteKit:
    path: AgentRemoteKit
schemes:
  AgentRemote:
    build:
      targets:
        AgentRemote: all
        AgentRemoteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentRemoteUITests
targets:
  AgentRemote:
    type: application
    platform: iOS
    sources:
      - path: AgentRemoteApp
    dependencies:
      - package: AgentRemoteKit
        product: AgentRemoteKit
    settings:
      base:
        INFOPLIST_FILE: AgentRemoteApp/Info.plist
        # Merge the standard generated keys (CFBundleIdentifier, CFBundleExecutable, version, …) into
        # the custom Info.plist above. Without this the built .app has no bundle id and won't install
        # ("Missing bundle ID"); the custom keys (ATS, orientations) are preserved by the merge.
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.agentremote.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: AgentRemote.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES
  AgentRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AgentRemoteUITests
    dependencies:
      - target: AgentRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.agentremote.uitests
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: AgentRemote
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
