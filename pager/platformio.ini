; Agent Remote client — LILYGO T-LoRa Pager (SX1262 / K257)
;
;   pio run -e tlora_pager_sx1262
;   pio run -e tlora_pager_sx1262 -t upload
;   pio device monitor -b 115200
;
; If the device is dead after a bad flash:
;   1) Hold BOOT, tap RST, release BOOT (download mode)
;   2) pio run -e tlora_pager_sx1262 -t erase
;   3) pio run -e tlora_pager_sx1262 -t upload
;   4) Tap RST

[platformio]
default_envs = tlora_pager_sx1262
src_dir = src
include_dir = include
boards_dir = boards

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  lovyan03/LovyanGFX @ ^1.2.0
  adafruit/Adafruit TCA8418 @ ^1.0.2

[env:tlora_pager_sx1262]
; Custom board: 16MB flash + QSPI PSRAM (NOT qio_opi — that bricks boot).
; Image header flash mode is DIO to match the official arduino-esp32
; "LilyGo-T-LoRa-Pager" board def — a QIO header can leave the ROM loader
; unable to read flash on some chips (dead after flash, no serial).
board = tlora-pager
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DBOARD_TLORA_PAGER=1
  -DRADIO_SX1262=1
  -DARDUINOJSON_ENABLE_COMMENTS=0
  -I include
