; Agent Remote client — LILYGO T-LoRa Pager (SX1262 / K257)
;
;   pio run -e tlora_pager_sx1262
;   pio run -e tlora_pager_sx1262 -t upload
;   pio device monitor -b 115200
;
; If the device is dead after a bad flash:
;   1) Hold BOOT, tap RST, release BOOT (download mode)
;   2) pio run -e tlora_pager_sx1262 -t erase
;   3) pio run -e tlora_pager_sx1262 -t upload
;   4) Tap RST

[platformio]
default_envs = tlora_pager_sx1262
src_dir = src
include_dir = include
boards_dir = boards

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  lovyan03/LovyanGFX @ ^1.2.0
  adafruit/Adafruit TCA8418 @ ^1.0.2
  lvgl/lvgl @ ^9.4.0
  ; ES8311 codec bring-up (same driver Meshtastic uses on this board)
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.0.zip
  ; BLE Nordic UART for claude-desktop-buddy mode
  h2zero/NimBLE-Arduino @ ^1.4.3

; Shared build settings; each device env adds its variant include dir.
[device_base]
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=2
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DBOARD_HAS_PSRAM
  -DARDUINOJSON_ENABLE_COMMENTS=0
  -DLV_CONF_INCLUDE_SIMPLE
  -I include

; LILYGO T-LoRa Pager (verified). 16MB flash + QSPI PSRAM (NOT qio_opi —
; that bricks boot). DIO image header matches the official arduino-esp32
; "LilyGo-T-LoRa-Pager" def — a QIO header can brick boot on some chips.
[env:tlora_pager_sx1262]
extends = device_base
board = tlora-pager
build_flags =
  ${device_base.build_flags}
  -DBOARD_TLORA_PAGER=1
  -DRADIO_SX1262=1
  -I variants/tlora_pager

; LILYGO T-Deck / T-Deck Plus (EXPERIMENTAL — compiles, not yet verified on
; hardware). BB-style keyboard via I2C co-processor, trackball navigation.
[env:tdeck]
extends = device_base
board = t-deck
build_flags =
  ${device_base.build_flags}
  -DBOARD_TDECK=1
  -I variants/tdeck
