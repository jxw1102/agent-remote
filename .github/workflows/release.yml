# Build client + daemon artifacts and publish a GitHub Release.
#
# Trigger: push a version tag only, e.g.
#   git tag v2.4.5 && git push origin v2.4.5
#
# The release tag is the pushed ref (v2.4.5). The daemon __version__ is still
# read for the tarball name and release notes; keep them in sync.
#
# Assets:
#   - agent-remote.html                     web client (single file)
#   - AgentRemote.apk                       Android release
#   - AgentRemote.bar                       BlackBerry 10 (Docker NDK; best-effort)
#   - agentremoted-<ver>.tar.gz             packaged daemon + deploy helpers
#   - agentremote-full-tlora-pager.bin     LILYGO T-LoRa Pager full flash image (0x0)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Resolve version from tag + daemon __version__
        run: |
          # Prefer the pushed tag (v2.4.5 → 2.4.5); fall back to __version__.
          RAW="${GITHUB_REF_NAME:-}"
          if [[ "$RAW" == v* ]]; then
            VER="${RAW#v}"
          else
            VER=$(grep -E '^__version__\s*=' daemon/agentremoted/__init__.py \
              | head -1 \
              | sed -E 's/^__version__[[:space:]]*=[[:space:]]*["'\'']([^"'\'']+)["'\''].*/\1/')
          fi
          if [ -z "$VER" ]; then
            echo "Could not resolve version from tag or __init__.py" >&2
            exit 1
          fi
          PY_VER=$(grep -E '^__version__\s*=' daemon/agentremoted/__init__.py \
            | head -1 \
            | sed -E 's/^__version__[[:space:]]*=[[:space:]]*["'\'']([^"'\'']+)["'\''].*/\1/' || true)
          if [ -n "$PY_VER" ] && [ "$PY_VER" != "$VER" ]; then
            echo "WARN: tag v$VER does not match daemon __version__=$PY_VER" >&2
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Release version: $VER (tag v$VER)"

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build web client
        run: |
          cd web
          python3 build.py
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp -f dist/agent-remote.html "$GITHUB_WORKSPACE/dist/agent-remote.html"
          ls -la "$GITHUB_WORKSPACE/dist/agent-remote.html"
      - uses: actions/upload-artifact@v4
        with:
          name: web-html
          path: dist/agent-remote.html
          if-no-files-found: error

  daemon:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package daemon
        run: |
          VER="${{ needs.version.outputs.version }}"
          mkdir -p dist
          tar -czf "dist/agentremoted-${VER}.tar.gz" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='daemon/tests' \
            README.md LICENSE CONTRIBUTING.md SECURITY.md AGENTS.md \
            daemon deploy docs
          ls -la "dist/agentremoted-${VER}.tar.gz"
          tar -tzf "dist/agentremoted-${VER}.tar.gz" | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-tarball
          path: dist/agentremoted-*.tar.gz
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Build release APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          # copyApkToPublic no-ops when ~/Public is missing (CI).
          ./gradlew assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp -f app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/dist/AgentRemote.apk"
          ls -la "$GITHUB_WORKSPACE/dist/AgentRemote.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/AgentRemote.apk
          if-no-files-found: error

  blackberry:
    needs: version
    runs-on: ubuntu-latest
    # NDK image is large and may flake; do not block the whole release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build AgentRemote.bar (Docker NDK)
        working-directory: blackberry
        env:
          PUBLIC_DIR: ""
          OUTDIR: ${{ github.workspace }}/dist
        run: |
          mkdir -p "$OUTDIR"
          # Docker image user must be able to write the host-mounted out dir.
          chmod a+rwx "$OUTDIR"
          if docker pull delaya73/bbndk:latest; then
            ./build-bar-docker.sh unified || true
          fi
          if [ ! -f "$OUTDIR/AgentRemote.bar" ]; then
            docker pull accupara/bbndk:latest || true
            ./build-bar-docker.sh unified || true
          fi
          if [ -f "$OUTDIR/AgentRemote.bar" ]; then
            ls -la "$OUTDIR/AgentRemote.bar"
          else
            echo "WARN: BAR not produced (NDK image unavailable or build failed)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blackberry-bar
          path: dist/AgentRemote.bar
          if-no-files-found: warn

  pager:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            esp32/.pio
          key: pio-esp32-${{ hashFiles('esp32/platformio.ini') }}
          restore-keys: |
            pio-esp32-
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build LILYGO T-LoRa Pager firmware
        working-directory: esp32
        run: |
          pio run -e tlora_pager_sx1262
          python3 scripts/package-full-firmware.py
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # Full flash image (bootloader + partitions + boot_app0 + app @ 0x0).
          cp -f dist/agentremote-full-tlora-pager.bin \
            "$GITHUB_WORKSPACE/dist/agentremote-full-tlora-pager.bin"
          ls -la "$GITHUB_WORKSPACE/dist/agentremote-full-tlora-pager.bin"
          # Sanity: full image must be larger than the app alone.
          FULL=$(stat -c%s "$GITHUB_WORKSPACE/dist/agentremote-full-tlora-pager.bin")
          APP=$(stat -c%s .pio/build/tlora_pager_sx1262/firmware.bin)
          test "$FULL" -gt "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: pager-firmware-full
          path: dist/agentremote-full-tlora-pager.bin
          if-no-files-found: error

  publish:
    needs: [version, web, daemon, android, blackberry, pager]
    runs-on: ubuntu-latest
    if: >-
      always()
      && needs.version.result == 'success'
      && needs.web.result == 'success'
      && needs.daemon.result == 'success'
      && needs.android.result == 'success'
      && needs.pager.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release files
        run: |
          VER="${{ needs.version.outputs.version }}"
          mkdir -p release
          cp -f artifacts/web-html/agent-remote.html release/
          cp -f artifacts/daemon-tarball/agentremoted-*.tar.gz release/
          cp -f artifacts/android-apk/AgentRemote.apk release/
          cp -f artifacts/pager-firmware-full/agentremote-full-tlora-pager.bin release/
          if [ -f artifacts/blackberry-bar/AgentRemote.bar ]; then
            cp -f artifacts/blackberry-bar/AgentRemote.bar release/
          fi
          ls -la release/
          test -f release/agent-remote.html
          test -f release/AgentRemote.apk
          test -f "release/agentremoted-${VER}.tar.gz"
          test -f release/agentremote-full-tlora-pager.bin
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Agent Remote ${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            **agentremoted ${{ needs.version.outputs.version }}**

            | Asset | Use |
            |-------|-----|
            | `agentremoted-${{ needs.version.outputs.version }}.tar.gz` | Daemon sources + deploy helpers — install on Mac/Linux next to Claude / Grok / Codex |
            | `agent-remote.html` | Web client (open locally or host as static file) |
            | `AgentRemote.apk` | Android app (sideload) |
            | `AgentRemote.bar` | BlackBerry 10 app (when the NDK image build succeeds) |
            | `agentremote-full-tlora-pager.bin` | LILYGO T-LoRa Pager **full** flash image (bootloader + partitions + app). Flash at `0x0`: `esptool.py --chip esp32s3 write_flash 0x0 agentremote-full-tlora-pager.bin` |

            Get started: extract the daemon tarball, run `agentremoted`, then open the web HTML (or install APK/BAR) and **Add a daemon** with the host URL and token from `~/.agentremoted/token`.

            Repo: https://github.com/jxw1102/agent-remote
          files: release/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
