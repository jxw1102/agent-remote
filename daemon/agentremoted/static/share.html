<!DOCTYPE html>
<html lang="en" class="share">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Shared session · Agent Remote</title>

<style>
/* Agent Remote, browser client.
 *
 * A PC is not a phone stretched wide: this is a two-pane layout (session list
 * beside the transcript) with a keyboard-first composer. The accent is data,
 * not a build flag — --accent is rewritten per open session so a Claude
 * session reads warm and a Grok session reads cyan, exactly like the apps.
 */

:root {
  --bg: #0b0b0d;
  --surface: #101114;
  --surface-2: #15171b;
  --surface-3: #1b1d22;
  --line: #23262d;
  --text: #e6e8ec;
  --dim: #7a8394;
  --accent: #9aa4b2;          /* neutral until a session is open */
  --accent-soft: rgba(154, 164, 178, 0.14);
  --claude: #d97757;
  --grok: #00d4ff;
  --danger: #e5706b;
  --warn: #e0b454;
  --ok: #5fc98b;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

button {
  font: inherit;
  color: var(--text);
  background: var(--surface-3);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #0b0b0d;
  font-weight: 600;
}
button.danger { color: var(--danger); border-color: rgba(229, 112, 107, 0.4); }
button.ghost { background: none; border: none; color: var(--dim); font-size: 16px; }

input, textarea, select {
  font: inherit;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  width: 100%;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--accent);
}
a { color: var(--accent); }

.hidden { display: none !important; }

/* ---------------------------------------------------------------- layout */

.app {
  display: grid;
  grid-template-columns: minmax(300px, 26vw) 1fr;
  height: 100%;
  /* Grid items default to min-height:auto (= content size). Without this,
     the flex children never shrink and overflow-y:auto never engages. */
  min-height: 0;
}
@media (max-width: 860px) {
  /* Narrow window: one pane at a time, list on top. */
  .app { grid-template-columns: 1fr; grid-template-rows: 45% 1fr; }
}

.pane-list {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border-right: 1px solid var(--line);
  background: var(--surface);
}

.list-head { padding: 12px; border-bottom: 1px solid var(--line); flex: none; }
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  letter-spacing: 0.2px;
  margin-bottom: 10px;
}
.logo { width: 22px; height: 22px; flex: none; }
.head-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.head-actions button { padding: 5px 10px; font-size: 13px; }
#btn-sound {
  min-width: 34px;
  font-size: 15px;
  padding: 5px 8px;
  color: var(--dim);
}
#btn-sound[aria-pressed="true"] {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  background: var(--accent-soft);
}
.search { margin-bottom: 8px; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border-radius: 999px;
  padding: 3px 11px;
  font-size: 12px;
  background: var(--surface-3);
}
.chip[aria-pressed="true"] {
  background: var(--chip-soft, var(--accent-soft));
  border-color: var(--chip, var(--accent));
  color: var(--chip, var(--accent));
  font-weight: 600;
}
.chip.chip-error {
  border-color: color-mix(in srgb, var(--danger) 50%, var(--line));
  color: var(--danger);
}

.list-status { color: var(--dim); font-size: 12px; margin-top: 8px; }
.list-status .err { color: var(--danger); white-space: pre-wrap; }

.sessions {
  flex: 1 1 auto;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.day {
  padding: 12px 12px 4px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--dim);
}
.row {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: none;
  padding: 10px 12px;
  cursor: pointer;
}
.row:hover { background: var(--surface-2); }
.row[aria-current="true"] { background: var(--surface-3); }
.row-top { display: flex; gap: 8px; align-items: baseline; }
.row-title {
  flex: 1;
  min-width: 0;
  font-size: 13.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-when { color: var(--dim); font-size: 11px; flex: none; }

/* One strip of tags + shrinkable session id (must not wrap the id onto its own row). */
.row-meta {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 5px;
  flex-wrap: nowrap;
  min-width: 0;
  overflow: hidden;
}
.row-meta > .tag { flex: none; }
.row-preview {
  margin-top: 5px;
  color: var(--dim);
  font-size: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.row-preview mark { background: none; color: var(--warn); }

.tag {
  font-size: 11px;
  border-radius: 5px;
  padding: 1px 6px;
  background: var(--surface-3);
  color: var(--dim);
  white-space: nowrap;
}
.tag.provider,
.tag.host {
  color: var(--tag, var(--accent));
  background: color-mix(in srgb, var(--tag, var(--accent)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--tag, var(--accent)) 35%, transparent);
  font-weight: 600;
}
.tag.host {
  /* Slightly softer so a harness text badge can sit next to it. */
  font-weight: 500;
  opacity: 0.95;
}
.tag.waiting { color: var(--warn); background: rgba(224, 180, 84, 0.14); }

/* Focus state tags. Focus is a filter over the same list, so these are
   ordinary row chips — the row layout must not change between modes. Colour
   carries the urgency: amber wants you now, green is busy, neutral can wait. */
.tag.focus { font-weight: 600; }
.tag.focus-needs-answer {
  color: var(--warn);
  background: color-mix(in srgb, var(--warn) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 38%, transparent);
}
.tag.focus-failed {
  color: var(--danger);
  background: color-mix(in srgb, var(--danger) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
}
.tag.focus-working {
  color: var(--ok);
  background: color-mix(in srgb, var(--ok) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--ok) 32%, transparent);
}
/* Finished turn. Dim once you have opened it — read, waiting on you, no
   longer competing for attention. */
.tag.focus-turn-finished {
  color: var(--dim);
  background: transparent;
  border: 1px dashed var(--line);
}
/* ...and lit until you have, so an unread result stands out in the list. */
.tag.focus-turn-finished.focus-unread {
  color: var(--text);
  background: var(--surface-3);
  border: 1px solid color-mix(in srgb, var(--text) 28%, transparent);
}

/* Focus toggle chip. Same pill as the daemon filters beside it — Focus is one
   more way to narrow the same list, not a separate control. The check makes it
   read as a toggle rather than another filter name. */
.chip-focus {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.chip-focus svg { width: 13px; height: 13px; flex: none; }

/* Row "Done" control. Lives on the row rather than the chat header so the
   gesture is where the thing is, and it is hover-only so 40 idle rows do not
   each carry a button. Absolutely positioned and vertically centred: it floats
   over the row's own content instead of reserving a slot, so appearing never
   reflows the row. An opaque tinted background keeps the glyph readable over
   whatever text it covers. Opacity (not display) keeps it keyboard-focusable. */
.row { position: relative; }
.row-done {
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border-radius: 9px;
  color: var(--ok);
  border: 1px solid color-mix(in srgb, var(--ok) 38%, transparent);
  background: color-mix(in srgb, var(--ok) 12%, var(--surface-2));
  opacity: 0;
  pointer-events: none;
  transition: opacity 120ms ease;
}
.row-done svg { width: 18px; height: 18px; display: block; }
.row:hover .row-done,
.row:focus-visible .row-done,
.row-done:focus-visible {
  opacity: 1;
  pointer-events: auto;
}
.row-done:hover {
  background: color-mix(in srgb, var(--ok) 26%, var(--surface-2, #1b1e24));
}
/* Touch and coarse pointers never hover: show it always, dimmed. */
@media (hover: none) {
  .row-done { opacity: 0.72; pointer-events: auto; }
}

.pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  animation: breathe 1.6s ease-in-out infinite;
  flex: none;
}
/* Same slot as .pulse: permission / AskUserQuestion needs the human. */
.pulse-ask {
  flex: none;
  width: 12px;
  height: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  color: var(--warn);
  animation: ask-blink 1s step-end infinite;
}
@keyframes ask-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.15; }
}
@keyframes breathe { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }

/* ------------------------------------------------------------------ chat */

.pane-chat {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.chat-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  flex: none;
}
.chat-title { flex: 1; min-width: 0; }
.chat-title h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chat-sub {
  color: var(--dim);
  font-size: 12px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  min-width: 0;
}
.chat-cwd {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
/* Clickable session id — full string when space allows, ellipsis if not. */
button.session-id {
  font: inherit;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  background: var(--surface-3);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 1px 7px;
  cursor: pointer;
  /* Prefer showing the whole id; shrink only after cwd has given ground. */
  flex: 0 1 auto;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
button.session-id:hover {
  border-color: var(--accent);
  color: var(--accent);
}
/* Session-list chip: same row as other tags; shrinks with ellipsis. */
button.tag.session-id-tag {
  font-family: var(--mono);
  font-size: 10.5px;
  /* min-width:0 is required — buttons default to min-width:auto and refuse to shrink. */
  flex: 1 1 0;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
  padding: 1px 6px;
  line-height: 1.4;
  display: inline-block;
  text-align: left;
  vertical-align: middle;
}
button.tag.session-id-tag:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.sid-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.sid-full {
  font-family: var(--mono);
  font-size: 12px;
  word-break: break-all;
  flex: 1;
  min-width: 0;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
}
.chat-actions { display: flex; gap: 6px; flex: none; align-items: center; }
/* Square icon controls in the chat header (options / refresh / stop / Live TUI). */
button.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  padding: 0;
  flex: none;
  color: var(--dim);
}
button.icon-btn svg {
  width: 18px;
  height: 18px;
  display: block;
}
button.icon-btn:hover:not(:disabled) {
  color: var(--accent);
  border-color: var(--accent);
}
button.icon-btn.danger {
  color: var(--danger);
  border-color: rgba(229, 112, 107, 0.4);
}
button.icon-btn.danger:hover:not(:disabled) {
  color: var(--danger);
  border-color: var(--danger);
  background: rgba(229, 112, 107, 0.12);
}
/* Keep the slot reserved; do not use .hidden (display:none) — that reflows
   siblings. Idle Stop still occupies space so Live TUI never moves. */
button.icon-btn.icon-idle {
  visibility: hidden;
  pointer-events: none;
}

.banner {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  column-gap: 10px;
  row-gap: 2px;
  padding: 6px 16px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12.5px;
  line-height: 1.35;
  border-bottom: 1px solid var(--line);
  flex: none;
  min-width: 0;
}
/* Human gate (ask / permission): stand out from the normal working strip. */
.banner.needs-answer {
  background: rgba(95, 201, 139, 0.12);
  color: var(--ok);
  border-bottom-color: rgba(95, 201, 139, 0.28);
}
/*
 * Line 1: human description + elapsed/queued.
 * Line 2 (.banner-cmd): raw command / path / [attached: …] when present.
 */
.banner .banner-line {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.banner .banner-cmd {
  flex: 1 1 100%;
  min-width: 0;
  margin: 0;
  padding: 0 0 0 18px; /* align under text after the pulse */
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  font-size: 11.5px;
  line-height: 1.3;
  opacity: 0.78;
  color: inherit;
}
.banner .pulse,
.banner .banner-action {
  flex: none;
  align-self: center;
}
.banner .banner-action {
  padding: 4px 12px;
  font-size: 12px;
  line-height: 1.2;
}
.banner.needs-answer .banner-action.primary {
  background: var(--ok);
  border-color: var(--ok);
  color: #0b0b0d;
}

.transcript {
  flex: 1 1 auto;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 18px 0 8px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.thread { max-width: 900px; margin: 0 auto; padding: 0 20px; }

.msg {
  margin-bottom: 16px;
  position: relative;
}
.msg.user {
  background: var(--surface-3);
  border-radius: var(--radius);
  padding: 10px 14px;
}
.msg.user::before {
  content: "›";
  color: var(--accent);
  font-weight: 700;
  margin-right: 8px;
}
.msg.user .body { display: inline; white-space: pre-wrap; }
.msg.status { color: var(--dim); font-size: 12.5px; border-left: 2px solid var(--line); padding-left: 10px; }
.msg.notice {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--dim);
  font-size: 12.5px;
}
.msg.notice.error { color: var(--danger); background: rgba(229, 112, 107, 0.1); }
/* Timestamp sits in the same hover row as Copy / Rewind (right-aligned). */
.msg-tools {
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  opacity: 0;
  transition: opacity 0.1s;
}
.msg:hover .msg-tools { opacity: 1; }
.msg-tools .msg-time {
  margin-left: auto;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  color: var(--dim);
  white-space: nowrap;
  line-height: 1.4;
}
.msg-tools button { padding: 2px 8px; font-size: 11px; }

.load-older { display: block; margin: 0 auto 18px; }

.empty {
  max-width: 420px;
  margin: 14vh auto;
  text-align: center;
  color: var(--dim);
}
.empty-logo {
  width: 54px;
  height: 54px;
  display: block;
  margin: 0 auto 4px;
  opacity: 0.95;
}
.empty h2 { color: var(--text); font-size: 17px; margin: 14px 0 6px; }
.empty p { margin: 0 0 10px; line-height: 1.45; }
.empty strong { color: var(--text); font-weight: 600; }
.empty code {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--surface-3);
  padding: 1px 6px;
  border-radius: 4px;
  color: var(--text);
}
.welcome { max-width: 460px; padding: 0 16px; }
.welcome-steps {
  text-align: left;
  margin: 14px auto 18px;
  padding: 0 0 0 1.25em;
  color: var(--dim);
  line-height: 1.55;
  max-width: 360px;
}
.welcome-steps li { margin: 6px 0; }
.welcome-steps strong { color: var(--text); }
.welcome-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  align-items: center;
  margin: 12px 0 8px;
}
.welcome-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 600;
}
.welcome-link:hover { text-decoration: underline; }
/* Session-list empty (no daemons): short note only — full guide is in transcript. */
.empty.list-quiet {
  max-width: none;
  padding: 28px 16px;
  text-align: left;
  color: var(--muted);
  font-size: 13px;
}
.empty.list-quiet p { margin: 0; line-height: 1.4; }

/* -------------------------------------------------------------- markdown */

.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; white-space: pre-wrap; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
  margin: 18px 0 8px;
  color: var(--heading, var(--accent));
  line-height: 1.3;
}
.md h1 { font-size: 19px; }
.md h2 { font-size: 17px; }
.md h3 { font-size: 15.5px; }
.md h4, .md h5, .md h6 { font-size: 14.5px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 24px; }
.md li { margin-bottom: 4px; }
.md li::marker { color: var(--accent); }
.md blockquote {
  margin: 0 0 10px;
  padding-left: 12px;
  border-left: 3px solid var(--accent-soft);
  color: var(--dim);
}
.md hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
.md code.inline {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--inline-code, var(--accent));
  background: var(--surface-2);
  padding: 1px 4px;
  border-radius: 4px;
}

/* GFM task lists (grok todo_write → "- [ ]" / "- [x]"). */
.md ul.task-list {
  list-style: none;
  padding-left: 0;
  margin: 0 0 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}
.md li.task-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 0;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  line-height: 1.45;
}
.md li.task-item:last-child { border-bottom: none; }
.md li.task-item.is-done { color: var(--dim); }
.md li.task-item.is-done .task-body { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--dim) 55%, transparent); }
.md .task-check {
  flex: none;
  width: 16px;
  height: 16px;
  margin-top: 2px;
  border-radius: 4px;
  border: 1.5px solid color-mix(in srgb, var(--dim) 55%, transparent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  line-height: 1;
  color: transparent;
  background: transparent;
}
.md .task-check.on {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 22%, transparent);
  color: var(--accent);
  font-weight: 700;
}
.md .task-body { flex: 1; min-width: 0; }

.code-wrap {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #0d0f13;
  margin: 0 0 12px;
  overflow: hidden;
}
.code-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 8px 4px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}

const TASK = /^(\s*)([-*+])\s+\[([ xX])\]\s+(.*)$/;
const BULLET = /^(\s*)([-*+])\s+(.*)$/;
const ORDERED = /^(\s*)(\d{1,3})[.)]\s+(.*)$/;
const QUOTE = /^\s{0,3}>\s?(.*)$/;
// Separator cell: --- / :--- / ---: / :---: (2+ dashes). Leading/trailing
// pipes optional so both `|---|---|` and `---|---` parse.
const TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/;
// Status words agents put in table cells — rendered as pills.
const STATUS_CELL = /^(pending|todo|done|completed|complete|in[\s_-]?progress|active|blocked|cancelled|canceled|failed|error|ok|pass|passed|fail|wip|open|closed)$/i;

/** Escaping is done by the DOM (textContent), never by string replacement. */
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderMarkdown(source) {
  const host = el("div", "md");
  if (!source) return host;
  const lines = String(source).replace(/\r\n?/g, "\n").split("\n");
  renderLines(lines, host);
  return host;
}

function renderLines(lines, host) {
  let para = [];
  const flush = () => {
    if (!para.length) return;
    const text = para.join("\n").trim();
    para = [];
    if (text) host.appendChild(inlineInto(el("p"), text));
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    const fence = FENCE.exec(line);
    if (fence) {
      flush();
      const marker = fence[1];
      const lang = (fence[2] || "").toLowerCase();
      const body = [];
      i++;
      for (; i < lines.length; i++) {
        const close = FENCE.exec(lines[i]);
        // A closing fence uses the same character and is at least as long;
        // a shorter run inside the block stays literal.
        if (close && close[1][0] === marker[0]
            && close[1].length >= marker.length && !close[2]) break;
        body.push(lines[i]);
      }
      host.appendChild(codeBlock(body.join("\n").replace(/\s+$/, ""), lang));
      continue;
    }

    if (!line.trim()) { flush(); continue; }

    if (RULE.test(line)) { flush(); host.appendChild(el("hr")); continue; }

    const head = ATX.exec(line);
    if (head) {
      flush();
      const level = Math.min(head[1].length, 6);
      host.appendChild(inlineInto(el("h" + level), head[2]));
      continue;
    }

    if (QUOTE.test(line)) {
      flush();
      const body = [];
      for (; i < lines.length; i++) {
        const m = QUOTE.exec(lines[i]);
        if (!m) break;
        body.push(m[1]);
      }
      i--;
      const quote = el("blockquote");
      renderLines(body, quote);
      host.appendChild(quote);
      continue;
    }

    // Pipe table: a header row followed by a |---|---| separator.
    // Alignments come from the separator (:--- / ---: / :---:).
    if (line.includes("|") && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1])) {
      flush();
      const header = splitRow(line);
      const aligns = splitRow(lines[i + 1]).map(cellAlign);
      i += 2;
      const rows = [];
      for (; i < lines.length && lines[i].includes("|") && lines[i].trim(); i++) {
        // A second separator mid-stream ends the table (rare, but safer).
        if (TABLE_SEP.test(lines[i])) break;
        rows.push(splitRow(lines[i]));
      }
      i--;
      host.appendChild(table(header, rows, aligns));
      continue;
    }

    // Task list (GFM checkboxes) — grok's todo_write emits these.
    const task = TASK.exec(line);
    if (task) {
      flush();
      const list = el("ul", "task-list");
      for (; i < lines.length; i++) {
        const t = TASK.exec(lines[i]);
        if (!t) break;
        const checked = /x/i.test(t[3]);
        const body = t[4];
        const li = el("li", "task-item" + (checked ? " is-done" : ""));
        // Decorative only: the transcript is read-only, so no real <input>.
        const box = el("span", "task-check" + (checked ? " on" : ""), checked ? "✓" : "");
        box.setAttribute("aria-hidden", "true");
        li.appendChild(box);
        li.appendChild(inlineInto(el("span", "task-body"), body));
        list.appendChild(li);
      }
      i--;
      host.appendChild(list);
      continue;
    }

    const bullet = BULLET.exec(line);
    const ordered = bullet ? null : ORDERED.exec(line);
    if (bullet || ordered) {
      flush();
      const listTag = bullet ? "ul" : "ol";
      const list = el(listTag);
      if (ordered) list.start = parseInt(ordered[2], 10) || 1;
      for (; i < lines.length; i++) {
        // A task item starts a new list rather than nesting as a plain bullet.
        if (TASK.test(lines[i])) break;
        const b = BULLET.exec(lines[i]);
        const o = b ? null : ORDERED.exec(lines[i]);
        if (!b && !o) break;
        const body = [(b || o)[3]];
        // Continuation lines: indented, and not a new block of any kind.
        while (i + 1 < lines.length) {
          const next = lines[i + 1];
          if (!next.trim() || BULLET.test(next) || ORDERED.test(next)
              || TASK.test(next)
              || ATX.test(next) || FENCE.test(next) || QUOTE.test(next)) break;
          if (!/^[ \t]/.test(next)) break;
          body.push(next.trim());
          i++;
        }
        list.appendChild(inlineInto(el("li"), body.join("\n")));
      }
      i--;
      host.appendChild(list);
      continue;
    }

    para.push(line);
  }
  flush();
}

function cellAlign(sep) {
  const s = String(sep || "").trim();
  const left = s.startsWith(":");
  const right = s.endsWith(":");
  if (left && right) return "center";
  if (right) return "right";
  if (left) return "left";
  return "";
}

/**
 * Rank/index first column only when the header is #/n/id, or the header is
 * empty AND every body cell is a short numeric/roman index. An empty header
 * with long label cells (comparison tables) must stay a normal column.
 */
function isRankFirstColumn(header, rows) {
  const firstHead = String(header[0] || "").trim();
  if (/^(#|n|no\.?|id)$/i.test(firstHead)) return true;
  if (firstHead) return false;
  if (!rows.length) return false;
  return rows.every((r) => {
    const c = String(r[0] || "").trim();
    if (!c) return true;
    if (c.length > 6) return false;
    return /^(#?\d{1,4}|[ivxlcdm]{1,6})$/i.test(c);
  });
}

function table(header, rows, aligns = []) {
  const width = Math.max(header.length, ...rows.map((r) => r.length), 0);
  const pad = (cells) => {
    const out = cells.slice(0, width);
    while (out.length < width) out.push("");
    return out;
  };
  // First column is often "#" / a rank — keep it narrow via a class.
  // Do NOT treat a blank header as rank: agents often leave the row-label
  // column untitled (e.g. | | A | B | with "PPV orders" in body cells), and
  // max-width:4em then clips those labels into the next column.
  const rankCol = isRankFirstColumn(header, rows);

  const wrap = el("div", "md-table-wrap");
  const t = el("table");
  if (rankCol) t.classList.add("has-rank");
  const thead = el("thead");
  const hrow = el("tr");
  pad(header).forEach((cell, i) => {
    const th = inlineInto(el("th"), cell);
    if (aligns[i]) th.style.textAlign = aligns[i];
    if (rankCol && i === 0) th.classList.add("col-rank");
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);
  t.appendChild(thead);
  const tbody = el("tbody");
  rows.forEach((row) => {
    const tr = el("tr");
    pad(row).forEach((cell, i) => {
      const td = tableCell(cell);
      if (aligns[i]) td.style.textAlign = aligns[i];
      if (rankCol && i === 0) td.classList.add("col-rank");
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  return wrap;
}

/** Status words become pills; everything else is normal inline markdown. */
function tableCell(text) {
  const plain = String(text ?? "").trim();
  if (STATUS_CELL.test(plain)) {
    const td = el("td");
    const kind = plain.toLowerCase().replace(/[\s_]+/g, "-");
    const pill = el("span", "status-pill status-" + kind, plain);
    td.appendChild(pill);
    return td;
  }
  return inlineInto(el("td"), text);
}

function splitRow(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|") && !s.endsWith("\\|")) s = s.slice(0, -1);
  const cells = [];
  let cur = "";
  let escaped = false;
  for (const ch of s) {
    if (escaped) { cur += ch; escaped = false; continue; }
    if (ch === "\\") { escaped = true; continue; }
    if (ch === "|") { cells.push(cur.trim()); cur = ""; continue; }
    cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}

function codeBlock(code, lang) {
  const wrap = el("div", "code-wrap");
  const bar = el("div", "code-bar");
  const resolved = resolveLang(lang);
  bar.appendChild(el("span", "code-lang", resolved.label || lang || "text"));
  const copy = el("button", "code-copy", "Copy");
  copy.type = "button";
  copy.addEventListener("click", async () => {
    try {
      // Secure contexts get the real API; plain-http hosting falls back.
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(code);
      } else {
        const ta = document.createElement("textarea");
        ta.value = code;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand && document.execCommand("copy");
        ta.remove();
        if (!ok) throw new Error("clipboard unavailable");
      }
      copy.textContent = "Copied";
    } catch {
      copy.textContent = "Blocked";
    }
    setTimeout(() => { copy.textContent = "Copy"; }, 1400);
  });
  bar.appendChild(copy);
  wrap.appendChild(bar);
  const pre = el("pre");
  const codeEl = el("code", resolved.id ? "lang-" + resolved.id : null);
  highlightInto(codeEl, code, resolved.id);
  pre.appendChild(codeEl);
  wrap.appendChild(pre);
  return wrap;
}

// -- syntax highlight -----------------------------------------------------
// Self-contained tokeniser: no CDN, no npm. Covers the languages agent
// transcripts actually emit. Unknown languages stay plain monospace text.

const LANG_ALIASES = {
  js: "javascript", jsx: "javascript", mjs: "javascript", cjs: "javascript",
  ts: "typescript", tsx: "typescript",
  py: "python", python3: "python", py3: "python",
  sh: "bash", shell: "bash", zsh: "bash", bash: "bash",
  yml: "yaml", yaml: "yaml",
  md: "markdown", markdown: "markdown",
  rs: "rust", go: "go", golang: "go",
  c: "c", h: "c", cpp: "cpp", cc: "cpp", cxx: "cpp", hpp: "cpp",
  cs: "csharp", csharp: "csharp",
  rb: "ruby", java: "java", kt: "kotlin", kotlin: "kotlin",
  sql: "sql", html: "html", xml: "html", svg: "html",
  css: "css", scss: "css", less: "css",
  json: "json", jsonc: "json",
  toml: "toml", ini: "ini", conf: "ini", env: "ini",
  diff: "diff", patch: "diff",
  dockerfile: "dockerfile", docker: "dockerfile",
  make: "makefile", makefile: "makefile",
  text: "", plain: "", plaintext: "", txt: "",
};

const C_LIKE_KW = splitKw(
  "if else for while do switch case break continue return try catch finally "
  + "throw new class extends implements interface public private protected "
  + "static final abstract void const let var function async await yield "
  + "import export from default typeof instanceof in of this super "
  + "true false null undefined NaN Infinity delete void with debugger "
  + "enum package throws synchronized volatile transient native "
  + "goto struct union typedef extern register signed unsigned sizeof "
  + "namespace using template typename virtual override explicit friend "
  + "operator constexpr noexcept decltype auto constexpr "
  + "public private protected internal sealed partial readonly "
  + "get set value where select group into orderby join on equals "
  + "var fun val object data companion when is as in out typealias "
  + "suspend inline reified crossinline noinline"
);

const PYTHON_KW = splitKw(
  "False None True and as assert async await break class continue def del "
  + "elif else except finally for from global if import in is lambda "
  + "nonlocal not or pass raise return try while with yield match case "
  + "self cls"
);

const BASH_KW = splitKw(
  "if then else elif fi for while until do done case esac function select "
  + "time coproc in return exit break continue shift export local readonly "
  + "declare typeset unset eval exec source alias unalias set unset "
  + "true false"
);

const SQL_KW = splitKw(
  "select from where and or not null is in like between join left right "
  + "inner outer full cross on group by order having limit offset as "
  + "insert into values update set delete create table index view alter "
  + "drop truncate distinct count sum avg min max union all exists case "
  + "when then else end primary key foreign references constraint default "
  + "unique check cascade restrict with recursive over partition"
);

const RUST_KW = splitKw(
  "as async await break const continue crate dyn else enum extern false fn "
  + "for if impl in let loop match mod move mut pub ref return self Self "
  + "static struct super trait true type unsafe use where while yield "
  + "abstract become box do final macro override priv typeof unsized "
  + "virtual yield try"
);

const GO_KW = splitKw(
  "break case chan const continue default defer else fallthrough for func "
  + "go goto if import interface map package range return select struct "
  + "switch type var true false nil iota"
);

const RUBY_KW = splitKw(
  "BEGIN END alias and begin break case class def defined do else elsif "
  + "end ensure false for if in module next nil not or redo rescue retry "
  + "return self super then true undef unless until when while yield"
);

function splitKw(s) {
  return new Set(s.trim().split(/\s+/).filter(Boolean));
}

function resolveLang(raw) {
  const key = String(raw || "").toLowerCase().replace(/^\./, "");
  if (!key) return { id: "", label: "text" };
  const id = LANG_ALIASES[key] !== undefined ? LANG_ALIASES[key] : key;
  if (!id) return { id: "", label: key || "text" };
  return { id, label: key };
}

function highlightInto(codeEl, code, langId) {
  const text = String(code ?? "");
  if (!langId || !text) {
    codeEl.textContent = text;
    return;
  }
  if (langId === "diff") {
    highlightDiff(codeEl, text);
    return;
  }
  if (langId === "json") {
    highlightJson(codeEl, text);
    return;
  }
  const rules = rulesFor(langId);
  if (!rules) {
    codeEl.textContent = text;
    return;
  }
  appendTokens(codeEl, tokenize(text, rules));
}

/**
 * Paint `code` into a host element with the fenced-block tokeniser.
 * Used by process-view step bodies when the daemon sends a `lang` hint.
 * Unknown / empty lang → plain textContent (no token spans).
 */
function paintCode(host, code, lang) {
  if (!host) return;
  host.replaceChildren();
  const text = String(code ?? "");
  const id = resolveLang(lang).id;
  if (!id || !text) {
    host.textContent = text;
    return;
  }
  highlightInto(host, text, id);
}

function highlightDiff(host, text) {
  const lines = text.split("\n");
  lines.forEach((line, i) => {
    if (i) host.appendChild(document.createTextNode("\n"));
    let cls = "";
    if (/^\+/.test(line) && !/^\+\+\+/.test(line)) cls = "tok-ins";
    else if (/^-/.test(line) && !/^---/.test(line)) cls = "tok-del";
    else if (/^@@/.test(line)) cls = "tok-meta";
    else if (/^(diff |index |--- |\+\+\+)/.test(line)) cls = "tok-meta";
    if (cls) {
      const s = el("span", cls);
      s.textContent = line;
      host.appendChild(s);
    } else {
      host.appendChild(document.createTextNode(line));
    }
  });
}

function highlightJson(host, text) {
  // Keys ("x":), string values, numbers, bools/null, punctuation.
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|(-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b|([{}[\],])/g;
  let last = 0;
  let m;
  while ((m = re.exec(text))) {
    if (m.index > last) host.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1] !== undefined) {
      const s = el("span", m[2] !== undefined ? "tok-prop" : "tok-str");
      s.textContent = m[1];
      host.appendChild(s);
      if (m[2]) {
        const ws = m[2].slice(0, -1);
        if (ws) host.appendChild(document.createTextNode(ws));
        const c = el("span", "tok-punct");
        c.textContent = ":";
        host.appendChild(c);
      }
    } else if (m[3] !== undefined) {
      const s = el("span", "tok-num");
      s.textContent = m[3];
      host.appendChild(s);
    } else if (m[4] !== undefined) {
      const s = el("span", "tok-kw");
      s.textContent = m[4];
      host.appendChild(s);
    } else if (m[5] !== undefined) {
      const s = el("span", "tok-punct");
      s.textContent = m[5];
      host.appendChild(s);
    }
    last = m.index + m[0].length;
  }
  if (last < text.length) host.appendChild(document.createTextNode(text.slice(last)));
}

function rulesFor(langId) {
  switch (langId) {
    case "javascript":
    case "typescript":
      return {
        keywords: C_LIKE_KW,
        builtins: splitKw("console Math JSON Object Array String Number Boolean Promise Map Set Date Error fetch parseInt parseFloat isNaN"),
        lineComment: "//",
        blockComment: ["/*", "*/"],
        strings: true,
        template: true,
        regex: true,
        numbers: true,
        hashbang: true,
      };
    case "python":
      return {
        keywords: PYTHON_KW,
        builtins: splitKw("print len range open type str int float list dict set tuple bool object super property staticmethod classmethod enumerate zip map filter any all min max sum abs"),
        lineComment: "#",
        strings: true,
        triple: true,
        numbers: true,
        hashbang: true,
        decorators: true,
      };
    case "bash":
      return {
        keywords: BASH_KW,
        lineComment: "#",
        strings: true,
        numbers: true,
        hashbang: true,
        shell: true,
      };
    case "c":
    case "cpp":
    case "csharp":
    case "java":
    case "kotlin":
      return {
        keywords: C_LIKE_KW,
        lineComment: "//",
        blockComment: ["/*", "*/"],
        strings: true,
        numbers: true,
        preprocessor: true,
      };
    case "go":
      return {
        keywords: GO_KW,
        builtins: splitKw("append cap close complex copy delete imag len make new panic print println real recover true false nil"),
        lineComment: "//",
        blockComment: ["/*", "*/"],
        strings: true,
        numbers: true,
      };
    case "rust":
      return {
        keywords: RUST_KW,
        lineComment: "//",
        blockComment: ["/*", "*/"],
        strings: true,
        numbers: true,
        lifetime: true,
      };
    case "ruby":
      return {
        keywords: RUBY_KW,
        lineComment: "#",
        strings: true,
        numbers: true,
        symbols: true,
      };
    case "sql":
      return {
        keywords: SQL_KW,
        lineComment: "--",
        blockComment: ["/*", "*/"],
        strings: true,
        numbers: true,
        caseInsensitiveKw: true,
      };
    case "css":
      return {
        lineComment: null,
        blockComment: ["/*", "*/"],
        strings: true,
        numbers: true,
        css: true,
      };
    case "html":
      return {
        lineComment: null,
        blockComment: null,
        strings: true,
        html: true,
      };
    case "yaml":
      return {
        lineComment: "#",
        strings: true,
        numbers: true,
        yaml: true,
      };
    case "toml":
    case "ini":
      return {
        lineComment: "#",
        strings: true,
        numbers: true,
        ini: true,
      };
    case "dockerfile":
      return {
        keywords: splitKw("FROM RUN CMD LABEL MAINTAINER EXPOSE ENV ADD COPY ENTRYPOINT VOLUME USER WORKDIR ARG ONBUILD STOPSIGNAL HEALTHCHECK SHELL AS"),
        lineComment: "#",
        strings: true,
        numbers: true,
        caseInsensitiveKw: true,
      };
    case "makefile":
      return {
        lineComment: "#",
        strings: true,
        makefile: true,
      };
    case "markdown":
      return {
        markdown: true,
      };
    default:
      // Generic: comments-ish + strings + numbers for unknown fenced langs.
      return {
        keywords: new Set(),
        lineComment: "//",
        blockComment: ["/*", "*/"],
        strings: true,
        numbers: true,
      };
  }
}

function tokenize(src, rules) {
  const out = [];
  let i = 0;
  const n = src.length;
  const push = (type, text) => {
    if (!text) return;
    // Merge adjacent same-type tokens.
    const last = out[out.length - 1];
    if (last && last.type === type) last.text += text;
    else out.push({ type, text });
  };
  const plain = (text) => push("", text);

  while (i < n) {
    // Hashbang
    if (rules.hashbang && i === 0 && src.startsWith("#!")) {
      const end = src.indexOf("\n");
      const take = end < 0 ? src : src.slice(0, end);
      push("tok-meta", take);
      i += take.length;
      continue;
    }

    // HTML tags (before comments that look like <!--)
    if (rules.html && src[i] === "<") {
      if (src.startsWith("<!--", i)) {
        const end = src.indexOf("-->", i + 4);
        const take = end < 0 ? src.slice(i) : src.slice(i, end + 3);
        push("tok-cmt", take);
        i += take.length;
        continue;
      }
      const end = src.indexOf(">", i);
      if (end > i) {
        push("tok-tag", src.slice(i, end + 1));
        i = end + 1;
        continue;
      }
    }

    // Block comment
    if (rules.blockComment && src.startsWith(rules.blockComment[0], i)) {
      const open = rules.blockComment[0];
      const close = rules.blockComment[1];
      const end = src.indexOf(close, i + open.length);
      const take = end < 0 ? src.slice(i) : src.slice(i, end + close.length);
      push("tok-cmt", take);
      i += take.length;
      continue;
    }

    // Line comment
    if (rules.lineComment && src.startsWith(rules.lineComment, i)) {
      // SQL/YAML: "--" / "#" only when not mid-token is fine for our purposes.
      const end = src.indexOf("\n", i);
      const take = end < 0 ? src.slice(i) : src.slice(i, end);
      push("tok-cmt", take);
      i += take.length;
      continue;
    }

    // Preprocessor (#include …)
    if (rules.preprocessor && src[i] === "#" && (i === 0 || src[i - 1] === "\n")) {
      const end = src.indexOf("\n", i);
      const take = end < 0 ? src.slice(i) : src.slice(i, end);
      push("tok-meta", take);
      i += take.length;
      continue;
    }

    // Decorators (@foo)
    if (rules.decorators && src[i] === "@" && /[A-Za-z_]/.test(src[i + 1] || "")) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
      push("tok-meta", src.slice(i, j));
      i = j;
      continue;
    }

    // Rust lifetimes 'a
    if (rules.lifetime && src[i] === "'" && /[A-Za-z_]/.test(src[i + 1] || "")) {
      let j = i + 1;
